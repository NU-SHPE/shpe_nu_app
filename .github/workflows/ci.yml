name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# One run per branch/PR; a new push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Smoke tests never reach Firebase — the web build just needs the vars to
      # exist so firebaseConfig.ts can call initializeApp(). Real values live in
      # Vercel; these placeholders keep CI self-contained.
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      EXPO_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
